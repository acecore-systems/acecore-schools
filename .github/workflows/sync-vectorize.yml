name: Sync Schools Vectorize index

on:
  push:
    branches:
      - main
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      target:
        description: 同期先のVectorize index
        required: true
        type: choice
        default: preview
        options:
          - preview
          - production
      migration:
        description: 初回v1→v2移行だけで使う限定モード
        required: true
        type: choice
        default: none
        options:
          - none
          - v1-to-v2

permissions:
  contents: read

env:
  CLOUDFLARE_ACCOUNT_ID: db9b62f409f463da7acbcc374b8385d0
  PRODUCTION_BUILD_MARKER_URL: https://schools.acecore.net/.well-known/acecore-schools-build.json

jobs:
  sync-preview:
    name: Sync preview index from exact main
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.target == 'preview'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: cloudflare-schools-search-preview
    concurrency:
      group: vectorize-schools-search-preview
      cancel-in-progress: false

    steps:
      - name: Check out the exact dispatched main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          path: site
          persist-credentials: false

      - name: Verify the dispatched commit is current main
        shell: bash
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          checked_commit="$(git -C site rev-parse HEAD)"
          git -C site fetch --no-tags origin \
            "+refs/heads/main:refs/remotes/origin/main"
          current_main="$(git -C site rev-parse refs/remotes/origin/main)"

          if [[ "$checked_commit" != "$EXPECTED_COMMIT" ]] ||
             [[ "$checked_commit" != "$current_main" ]]; then
            echo "::error::Preview sync only accepts current main."
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: site/.node-version
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        working-directory: site
        run: npm ci

      - name: Validate the exact main site
        working-directory: site
        run: |
          npm run format:check
          npm run test:search
          npm run test:structured-data
          npm run types:cloudflare:check
          npm run check:pages-config
          npm run check:maintenance-config
          npm run typecheck:functions

      - name: Build and dry-run the exact main corpus
        working-directory: site
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          npm run build
          npm run sync:vectorize:dry-run

      - name: Reconfirm main before mutation
        shell: bash
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          git -C site fetch --no-tags origin \
            "+refs/heads/main:refs/remotes/origin/main"
          current_main="$(git -C site rev-parse refs/remotes/origin/main)"
          if [[ "$current_main" != "$EXPECTED_COMMIT" ]]; then
            echo "::error::Main changed while the Preview corpus was built."
            exit 1
          fi

      - name: Check out fresh verifier tooling before mutation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: verifier
          persist-credentials: false

      - name: Sync preview Vectorize index
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_SCHOOLS_SEARCH_PREVIEW_API_TOKEN }}
          MIGRATION_MODE: ${{ inputs.migration }}
          VECTORIZE_INDEX_NAME: acecore-schools-search-preview
        run: |
          set -euo pipefail
          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" ]]; then
            echo "::error::CLOUDFLARE_SCHOOLS_SEARCH_PREVIEW_API_TOKEN is not configured."
            exit 1
          fi

          args=(
            --corpus site/.vectorize/corpus.json
            --receipt "$RUNNER_TEMP/vectorize-receipt.json"
          )
          if [[ "$MIGRATION_MODE" == "v1-to-v2" ]]; then
            args+=(--migrate-v1-to-v2)
          elif [[ "$MIGRATION_MODE" != "none" ]]; then
            echo "::error::Unknown migration mode."
            exit 1
          fi

          node verifier/scripts/sync-vectorize.mjs "${args[@]}" |
            tee "$RUNNER_TEMP/vectorize-sync.log"

      - name: Stage preview sync evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          if [[ -f site/.vectorize/corpus.json ]]; then
            install -m 0644 site/.vectorize/corpus.json evidence/corpus.json
          fi
          if [[ -f "$RUNNER_TEMP/vectorize-sync.log" ]]; then
            install -m 0644 "$RUNNER_TEMP/vectorize-sync.log" evidence/sync.log
          fi
          if [[ -f "$RUNNER_TEMP/vectorize-receipt.json" ]]; then
            install -m 0644 "$RUNNER_TEMP/vectorize-receipt.json" evidence/receipt.json
          fi

      - name: Upload preview sync evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: acecore-schools-vectorize-preview-${{ github.sha }}-${{ github.run_id }}
          path: evidence
          if-no-files-found: error
          retention-days: 7

  build-production-corpus:
    name: Build the public Production corpus without secrets
    if: >-
      github.ref == 'refs/heads/main' &&
      (
        (
          vars.SCHOOLS_VECTORIZE_SYNC_ENABLED == 'true' &&
          (
            github.event_name == 'push' ||
            github.event_name == 'schedule'
          )
        ) ||
        (
          github.event_name == 'workflow_dispatch' &&
          inputs.target == 'production'
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      artifact_name: ${{ steps.identity.outputs.artifact_name }}
      corpus_sha256: ${{ steps.identity.outputs.corpus_sha256 }}
      corpus_version: ${{ steps.identity.outputs.corpus_version }}
      site_commit: ${{ steps.site.outputs.commit }}

    steps:
      - name: Check out the exact event tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          path: verifier
          persist-credentials: false

      - name: Set up verifier Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: verifier/.node-version

      - name: Wait for the pushed commit to be public
        if: github.event_name == 'push'
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: >-
          node verifier/scripts/wait-for-deployment.mjs
          "$PRODUCTION_BUILD_MARKER_URL"
          "$EXPECTED_COMMIT"

      - name: Resolve and verify the deployed site commit
        id: site
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          verifier_commit="$(git -C verifier rev-parse HEAD)"
          if [[ "$verifier_commit" != "$PUSH_COMMIT" ]]; then
            echo "::error::The verifier checkout does not match the event SHA."
            exit 1
          fi

          if [[ "$EVENT_NAME" == "push" ]]; then
            site_commit="$PUSH_COMMIT"
          else
            site_commit="$(
              node verifier/scripts/wait-for-deployment.mjs \
                "$PRODUCTION_BUILD_MARKER_URL" \
                --print-current
            )"
          fi
          site_commit="${site_commit,,}"

          if [[ ! "$site_commit" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Published marker does not contain a full Git SHA."
            exit 1
          fi
          if ! git -C verifier cat-file -e "${site_commit}^{commit}"; then
            echo "::error::Published commit does not exist in this repository."
            exit 1
          fi
          if ! git -C verifier merge-base --is-ancestor \
            "$site_commit" "$verifier_commit"; then
            echo "::error::Published commit is not an ancestor of the event main commit."
            exit 1
          fi

          echo "commit=$site_commit" >> "$GITHUB_OUTPUT"

      - name: Check out the deployed site source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.site.outputs.commit }}
          path: site
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: site/.node-version
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install deployed site dependencies
        working-directory: site
        run: npm ci

      - name: Validate the deployed site before building the corpus
        working-directory: site
        run: |
          npm run format:check
          npm run test:search
          npm run test:structured-data
          npm run types:cloudflare:check
          npm run check:pages-config
          npm run check:maintenance-config
          npm run typecheck:functions

      - name: Build and dry-run the deployed corpus
        working-directory: site
        env:
          COMMIT_SHA: ${{ steps.site.outputs.commit }}
        run: |
          npm run build
          npm run sync:vectorize:dry-run

      - name: Confirm the built corpus is still public
        run: >-
          node verifier/scripts/wait-for-deployment.mjs
          "$PRODUCTION_BUILD_MARKER_URL"
          --assert-current
          "${{ steps.site.outputs.commit }}"
          site/.vectorize/corpus.json

      - name: Resolve the verified corpus identity
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          corpus_version="$(
            node -p "JSON.parse(require('node:fs').readFileSync('site/.vectorize/corpus.json', 'utf8')).version"
          )"
          if [[ ! "$corpus_version" =~ ^[0-9a-f]{20}$ ]]; then
            echo "::error::Built corpus does not contain a valid version."
            exit 1
          fi

          corpus_sha256="$(sha256sum site/.vectorize/corpus.json | cut -d ' ' -f 1)"
          echo "corpus_version=$corpus_version" >> "$GITHUB_OUTPUT"
          echo "corpus_sha256=$corpus_sha256" >> "$GITHUB_OUTPUT"
          echo "artifact_name=acecore-schools-vectorize-production-build-${{ steps.site.outputs.commit }}-$corpus_version" >> "$GITHUB_OUTPUT"

      - name: Stage the verified Production corpus
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p verified-corpus
          install -m 0644 site/.vectorize/corpus.json verified-corpus/corpus.json
          install -m 0644 \
            site/dist/.well-known/acecore-schools-build.json \
            verified-corpus/build-marker.json

      - name: Upload the verified Production corpus
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.identity.outputs.artifact_name }}
          path: verified-corpus
          if-no-files-found: error
          retention-days: 7

  sync-production:
    name: Reconcile production index with the verified public corpus
    needs:
      - build-production-corpus
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: cloudflare-schools-search-production
    concurrency:
      group: vectorize-schools-search-production
      cancel-in-progress: false

    steps:
      - name: Check out the exact event verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          path: verifier
          persist-credentials: false

      - name: Set up verifier Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: verifier/.node-version

      - name: Download the verified Production corpus
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.build-production-corpus.outputs.artifact_name }}
          path: payload

      - name: Verify the event tooling and downloaded corpus
        shell: bash
        env:
          EXPECTED_CORPUS_SHA256: ${{ needs.build-production-corpus.outputs.corpus_sha256 }}
          EXPECTED_CORPUS_VERSION: ${{ needs.build-production-corpus.outputs.corpus_version }}
          EXPECTED_EVENT_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          verifier_commit="$(git -C verifier rev-parse HEAD)"
          if [[ "$verifier_commit" != "$EXPECTED_EVENT_COMMIT" ]]; then
            echo "::error::The privileged verifier does not match the event SHA."
            exit 1
          fi

          actual_sha256="$(sha256sum payload/corpus.json | cut -d ' ' -f 1)"
          if [[ "$actual_sha256" != "$EXPECTED_CORPUS_SHA256" ]]; then
            echo "::error::Downloaded corpus digest does not match the verified build."
            exit 1
          fi
          actual_version="$(
            node -p "JSON.parse(require('node:fs').readFileSync('payload/corpus.json', 'utf8')).version"
          )"
          if [[ "$actual_version" != "$EXPECTED_CORPUS_VERSION" ]]; then
            echo "::error::Downloaded corpus version does not match the verified build."
            exit 1
          fi

          node verifier/scripts/sync-vectorize.mjs \
            --dry-run \
            --corpus payload/corpus.json

      - name: Confirm the verified corpus is still public
        run: >-
          node verifier/scripts/wait-for-deployment.mjs
          "$PRODUCTION_BUILD_MARKER_URL"
          --assert-current
          "${{ needs.build-production-corpus.outputs.site_commit }}"
          payload/corpus.json

      - name: Sync production Vectorize index
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_SCHOOLS_SEARCH_PRODUCTION_API_TOKEN }}
          CORPUS_VERSION: ${{ needs.build-production-corpus.outputs.corpus_version }}
          MIGRATION_MODE: ${{ inputs.migration }}
          VECTORIZE_INDEX_NAME: acecore-schools-search-production
        run: |
          set -euo pipefail
          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" ]]; then
            echo "::error::CLOUDFLARE_SCHOOLS_SEARCH_PRODUCTION_API_TOKEN is not configured."
            exit 1
          fi

          args=(
            --corpus payload/corpus.json
            --confirm-production "$CORPUS_VERSION"
            --receipt "$RUNNER_TEMP/vectorize-receipt.json"
          )
          if [[ "$MIGRATION_MODE" == "v1-to-v2" ]]; then
            if [[ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]]; then
              echo "::error::Migration mode is manual-only."
              exit 1
            fi
            args+=(--migrate-v1-to-v2)
          elif [[ -n "$MIGRATION_MODE" && "$MIGRATION_MODE" != "none" ]]; then
            echo "::error::Unknown migration mode."
            exit 1
          fi
          node verifier/scripts/sync-vectorize.mjs "${args[@]}" |
            tee "$RUNNER_TEMP/vectorize-sync.log"

      - name: Confirm the synced corpus is still public
        run: >-
          node verifier/scripts/wait-for-deployment.mjs
          "$PRODUCTION_BUILD_MARKER_URL"
          --assert-current
          "${{ needs.build-production-corpus.outputs.site_commit }}"
          payload/corpus.json

      - name: Stage production sync evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          if [[ -f payload/corpus.json ]]; then
            install -m 0644 payload/corpus.json evidence/corpus.json
          fi
          if [[ -f payload/build-marker.json ]]; then
            install -m 0644 payload/build-marker.json evidence/build-marker.json
          fi
          if [[ -f "$RUNNER_TEMP/vectorize-sync.log" ]]; then
            install -m 0644 "$RUNNER_TEMP/vectorize-sync.log" evidence/sync.log
          fi
          if [[ -f "$RUNNER_TEMP/vectorize-receipt.json" ]]; then
            install -m 0644 "$RUNNER_TEMP/vectorize-receipt.json" evidence/receipt.json
          fi

      - name: Upload production sync evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: acecore-schools-vectorize-production-${{ needs.build-production-corpus.outputs.site_commit }}-${{ github.run_id }}
          path: evidence
          if-no-files-found: error
          retention-days: 30
