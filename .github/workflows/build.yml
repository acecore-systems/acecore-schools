name: Build

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check formatting
        run: npm run format:check
      - name: Test semantic search
        run: npm run test:search
      - name: Test structured data
        run: npm run test:structured-data
      - name: Check Cloudflare binding types
        run: npm run types:cloudflare:check
      - name: Build Pages Functions
        run: npm run check:pages-config
      - name: Build semantic search maintenance Worker
        run: npm run check:maintenance-config
      - name: Type-check Pages Functions
        run: npm run typecheck:functions
      - name: Build
        run: npm run build
